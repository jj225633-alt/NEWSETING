name: Build Hoshio Desktop

# 星汐電腦版（Windows）：desktop/ 有變動或手動執行時打包安裝檔，
# 放到只有一個提交的 desktop 分支，用 raw.githubusercontent.com 下載：
# https://raw.githubusercontent.com/<owner>/<repo>/desktop/hoshio-desktop-setup.exe
on:
  push:
    branches: [master, main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

concurrency:
  group: build-hoshio-desktop
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Check scripts
        working-directory: desktop
        run: npm run check

      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Publish to desktop branch
        run: |
          out="$RUNNER_TEMP/desktop-branch"
          mkdir -p "$out"
          exe=$(ls desktop/dist/*.exe | head -1)
          cp "$exe" "$out/hoshio-desktop-setup.exe"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/desktop"
          {
            echo "# 星汐電腦版下載"
            echo
            echo "- Windows：[hoshio-desktop-setup.exe]($raw/hoshio-desktop-setup.exe)"
            echo
            echo "這個分支只放最新一版的安裝檔（commit ${GITHUB_SHA::7}），每次更新會整個覆蓋。"
          } > "$out/README.md"
          cd "$out"
          git init -q -b desktop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "星汐電腦版（commit ${GITHUB_SHA::7}）"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" desktop
