name: Build Hoshio Desktop

# 星汐電腦版（Windows）：desktop/ 有變動或手動執行時打包安裝檔，
# 放到只有一個提交的 desktop 分支，用 raw.githubusercontent.com 下載：
# https://raw.githubusercontent.com/<owner>/<repo>/desktop/hoshio-desktop-setup.exe
on:
  push:
    branches: [master, main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

concurrency:
  group: build-hoshio-desktop
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Check scripts
        working-directory: desktop
        run: npm run check

      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Prepare installer
        run: |
          mkdir -p desktop/out
          cp "$(ls desktop/dist/*.exe | head -1)" desktop/out/hoshio-desktop-setup.exe
          cp "$(ls desktop/dist/*.7z | head -1)" desktop/out/hoshio-desktop-portable.7z
          ls -la desktop/out

      # 備用下載：Releases 沒有 100MB 的限制
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: desktop-latest
          name: 星汐電腦版（最新）
          prerelease: true
          files: |
            desktop/out/hoshio-desktop-setup.exe
            desktop/out/hoshio-desktop-portable.7z

      - name: Publish to desktop branch
        run: |
          out="$RUNNER_TEMP/desktop-branch"
          mkdir -p "$out"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/desktop"
          rel="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-latest"
          lines=""
          for f in hoshio-desktop-setup.exe hoshio-desktop-portable.7z; do
            size=$(stat -c %s "desktop/out/$f")
            if [ "$size" -lt 99000000 ]; then
              cp "desktop/out/$f" "$out/$f"
              lines="$lines\n- $f（$((size / 1048576)) MB）：[下載]($raw/$f)"
            else
              lines="$lines\n- $f（$((size / 1048576)) MB，超過 100MB 只放 Releases）：[下載]($rel/$f)"
            fi
          done
          {
            echo "# 星汐電腦版下載"
            echo
            echo -e "$lines"
            echo
            echo "- setup.exe：安裝版。portable.7z：免安裝，解壓縮後執行裡面的 Hoshio.exe。"
            echo "- 這個分支只放最新一版（commit ${GITHUB_SHA::7}），每次更新會整個覆蓋。"
          } > "$out/README.md"
          cd "$out"
          git init -q -b desktop
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "星汐電腦版（commit ${GITHUB_SHA::7}）"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" desktop
