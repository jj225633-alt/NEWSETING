name: Build Hoshio APK

# 每次推送到 master/main 或在 Actions 页面手动点击「Run workflow」时编译星汐 APK，
# 并发布到 Releases 的「latest-build」，手机打开链接即可下载，无需登录。
on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-hoshio
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4

      # 签名金钥放在仓库的 Settings → Secrets and variables → Actions，不会出现在源码里。
      # 固定使用同一把金钥，新版 APK 才能直接覆盖安装、保留资料。
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.HOSHIO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HOSHIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HOSHIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HOSHIO_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing HOSHIO_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing HOSHIO_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing HOSHIO_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing HOSHIO_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 Secrets:$missing。请到 Settings → Secrets and variables → Actions 新增后重新执行。"
            exit 1
          fi

      - name: Prepare signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.HOSHIO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HOSHIO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HOSHIO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HOSHIO_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/hoshio.jks
          {
            echo "storeFile=hoshio.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > local.properties

      # 与 Android Studio 自带的 JetBrains Runtime 21 保持一致
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # web 模块的 preBuild 会执行 `pnpm run build` 构建网页版（电脑浏览器使用的界面）
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      # 官方 Gradle Action：快取 Gradle 与依赖，并处理 wrapper 下载
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle 安装包放在 GitHub Releases，从 Actions 下载时常出现 504 / 超时，
      # 而 gradlew 自己只试一次。这里先用 curl 多次重试下载好，再让 wrapper 改读本地文件。
      - name: Download Gradle distribution
        run: |
          url=$(grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2- | sed 's/\\:/:/g')
          dest="$RUNNER_TEMP/$(basename "$url")"
          echo "Downloading $url"
          curl -fL --retry 10 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o "$dest" "$url"
          sed -i "s|^distributionUrl=.*|distributionUrl=file\\\\:$dest|" gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties

      # Maven Central 的大文件会被转到 GitHub Releases 下载，从 Actions 上常常 504。
      # 用 Gradle init 脚本把 Google 提供的 Maven Central 镜像放在最前面（只影响 CI，不改项目设置）；
      # 镜像里没有的套件会照常往下找 google()、mavenCentral() 等原本的仓库。
      - name: Use Maven Central mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/hoshio-mirror.gradle <<'EOF'
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven { url = mirror; name = 'MavenCentralGoogleMirror' }
              }
              settings.dependencyResolutionManagement.repositories {
                  maven { url = mirror; name = 'MavenCentralGoogleMirror' }
              }
          }
          EOF
          cat ~/.gradle/init.d/hoshio-mirror.gradle

      - name: Gradle Build
        run: |
          chmod +x gradlew
          # 偶尔会遇到下载 Gradle 或依赖时网络中断，失败就再试一次
          ./gradlew assembleGithubRelease || ./gradlew assembleGithubRelease

      # Releases 的下载链接常常 504，另外把 APK 放到只有一个提交的 apk 分支，
      # 用 raw.githubusercontent.com 下载比较稳定：
      # https://raw.githubusercontent.com/<owner>/<repo>/apk/hoshio-arm64-v8a.apk
      - name: Publish APK to apk branch
        run: |
          out="$RUNNER_TEMP/apk-branch"
          mkdir -p "$out"
          cp app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk "$out/hoshio-arm64-v8a.apk"
          cp app/build/outputs/apk/github/release/app-github-universal-release.apk "$out/hoshio-universal.apk"
          raw="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/apk"
          {
            echo "# 星汐 APK 下载"
            echo
            echo "- Pixel／一般手机：[hoshio-arm64-v8a.apk]($raw/hoshio-arm64-v8a.apk)"
            echo "- 通用版：[hoshio-universal.apk]($raw/hoshio-universal.apk)"
            echo
            echo "这个分支只放最新一版的安装档（commit ${GITHUB_SHA::7}），每次更新会整个覆盖。"
          } > "$out/README.md"
          cd "$out"
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "星汐 APK（commit ${GITHUB_SHA::7}）"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Publish latest build
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-build
          name: 星汐 最新构建
          prerelease: true
          make_latest: false
          body: |
            星汐（Hoshio）自动构建，commit `${{ github.sha }}`。

            手机一般下载 `arm64-v8a` 的 APK；不确定就下载 `universal` 版。
          files: |
            app/build/outputs/apk/github/release/*.apk

      - name: Clean up signing files
        if: always()
        run: rm -f app/hoshio.jks local.properties
