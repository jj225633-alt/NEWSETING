<!doctype html>
<!-- Based on hidden-letters-map by Saekisui - https://github.com/Saekisui/hidden-letters-map -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="leaflet.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  #map { height: 100%; border-radius: 28px; overflow: hidden; background: #dfe7ea; }
  @media (prefers-color-scheme: dark) { #map { background: #1c2228; } }
  body { font-family: system-ui, sans-serif; }
  #offline { display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #888; font-size: 14px; }
  .leaflet-popup-content { font-size: 14px; line-height: 1.5; margin: 10px 14px; }
  .leaflet-popup-content b { font-size: 15px; }
  .leaflet-control-attribution { font-size: 9px; }
  .tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
</style>
</head>
<body>
<div id="map"></div>
<div id="offline">地圖載入失敗。<br>藏寶清單在下方，仍然可以使用。</div>
<div id="tilehint" style="display:none;position:absolute;left:0;right:0;top:8px;text-align:center;font-size:12px;color:#999;z-index:1000;pointer-events:none">地圖底圖載入不了：檢查網路，或 VPN／廣告阻擋是否擋了 tile.openstreetmap.org</div>
<script src="leaflet.js"></script>
<script>
(function () {
  "use strict";
  const send = (m) => { try { window.HoshioTreasure && window.HoshioTreasure.postMessage(m); } catch (e) {} };
  window.addEventListener("error", (e) => send("err:" + (e.message || "error")));
  if (!window.L) { send("err:leaflet not loaded"); document.getElementById("offline").style.display = "flex"; window.hoshioRender = function () {}; return; }
  let map = null, tiles = null, layer = null, tileDark = null, fitted = false;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icons = (l) => (l.contents || []).map((c) => (c === "letter" ? "✉️" : "🏅")).join(" ");

  function ensure(dark) {
    if (!map) {
      map = L.map("map", { zoomControl: false, attributionControl: true }).setView([23.7, 121.0], 7);
      layer = L.layerGroup().addTo(map);
    }
    if (tileDark !== dark) {
      if (tiles) map.removeLayer(tiles);
      // CARTO 底圖現在要 API key，改用 OpenStreetMap 官方圖磚；深色模式用濾鏡調暗
      tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        className: dark ? "tiles-dark" : "",
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
      let loaded = 0, failed = 0;
      tiles.on("tileload", () => { if (!loaded) send("tiles-ok"); loaded++; document.getElementById("tilehint").style.display = "none"; });
      tiles.on("tileerror", () => { failed++; if (!loaded && failed >= 3) { document.getElementById("tilehint").style.display = "block"; if (failed === 3) send("tiles-fail"); } });
      tileDark = dark;
    }
  }

  window.hoshioRender = function (data) {
    ensure(!!data.dark);
    layer.clearLayers();
    const accent = data.accent || "#2f6f7c";
    const bounds = [];
    (data.letters || []).forEach((l) => {
      if (l.status === "sealed") {
        const c = L.circle([l.area.lat, l.area.lon], { radius: l.area.r, color: accent, weight: 1.5, dashArray: "4 6", fillColor: accent, fillOpacity: 0.12 });
        const progress = l.visitsNeeded ? "<br>到訪 " + l.visits + " / " + l.visitsNeeded + " 天" : "";
        c.bindPopup("🔒 <b>" + esc(l.hint) + "</b><br>" + icons(l) + progress);
        c.addTo(layer);
        bounds.push([l.area.lat, l.area.lon]);
      } else {
        const m = L.circleMarker([l.lat, l.lon], { radius: 8, color: "#fff", weight: 2, fillColor: l.status === "opened" ? "#d8a24a" : accent, fillOpacity: 0.95 });
        m.bindPopup((l.status === "opened" ? "📖 " : "🎁 ") + "<b>" + esc(l.place) + "</b><br>" + (l.status === "opened" ? "已拆開" : "找到了，還沒拆"));
        m.addTo(layer);
        bounds.push([l.lat, l.lon]);
      }
    });
    if (data.me) {
      L.circle([data.me.lat, data.me.lon], { radius: Math.max(15, data.me.acc || 0), color: "#4a90e2", weight: 1, fillOpacity: 0.15 }).addTo(layer);
      L.circleMarker([data.me.lat, data.me.lon], { radius: 6, color: "#fff", weight: 2, fillColor: "#4a90e2", fillOpacity: 1 }).addTo(layer);
      bounds.push([data.me.lat, data.me.lon]);
    }
    if (data.focusMe && data.me) map.setView([data.me.lat, data.me.lon], 15);
    else if (!fitted && bounds.length) { map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 }); fitted = true; }
  };
  // 不等 App 傳資料，先把地圖畫出來（深淺色跟著系統）
  try { ensure(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); } catch (e) { send("err:" + e.message); }
  send("ready");
})();
</script>
</body>
</html>
